function highlightMarker(id) { const el = document.querySelector('.marker-num[data-id="' + id + '"], .marker-diamond[data-id="' + id + '"]'); if (el) el.classList.add('active'); }
function unhighlightMarker(id) { const el = document.querySelector('.marker-num[data-id="' + id + '"], .marker-diamond[data-id="' + id + '"]'); if (el) el.classList.remove('active'); }
function highlightDaytrip(id) { const el = document.querySelector('.pp[data-id="' + id + '"]'); if (el) el.classList.add('active'); }
function unhighlightDaytrip(id) { const el = document.querySelector('.pp[data-id="' + id + '"]'); if (el) el.classList.remove('active'); }

// Llevar del mapa al sidebar de forma clara: expandir la card, anclar al inicio del
// "viaje" (la fila de transporte que precede al destino) y resaltarlo con un flash.
// Ancla al top del bloque para que la carga de imágenes de abajo no descoloque el scroll.
function flash(el) {
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1500);
}
// --- Deep-linking: ?stop=<id> abre y enfoca una parada (para compartir una vista). ---
function shareUrl(kind, id) {
  return location.origin + location.pathname + '?' + kind + '=' + encodeURIComponent(id);
}
function setView(kind, id) {  // kind: 'stop' | 'leg' | null
  const u = new URL(location.href);
  u.searchParams.delete('stop'); u.searchParams.delete('leg');
  if (kind && id) u.searchParams.set(kind, id);
  history.replaceState(null, '', u);
}
function hasViewParam() {
  const s = new URLSearchParams(location.search);
  return s.get('stop') || s.get('leg');
}
// --- Ficha individual por parada (modal): info condensada + mini-mapa con sus pines/rutas. ---
let _smMap = null, _smLayer = null;
function ensureStopModal() {
  let el = document.getElementById('stop-modal');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'stop-modal';
  el.className = 'stop-modal';
  el.hidden = true;
  el.innerHTML =
    '<div class="sm-backdrop"></div>' +
    '<div class="sm-dialog" role="dialog" aria-modal="true">' +
      '<div class="sm-topbar">' +
        '<button type="button" class="sm-share" title="Copiar link a esta parada">🔗 Copiar link</button>' +
        '<button type="button" class="sm-close" aria-label="Cerrar">×</button>' +
      '</div>' +
      '<div class="sm-content"></div>' +
    '</div>';
  document.body.appendChild(el);
  el.querySelector('.sm-backdrop').addEventListener('click', closeStopModal);
  el.querySelector('.sm-close').addEventListener('click', closeStopModal);
  return el;
}
function closeStopModal() {
  const el = document.getElementById('stop-modal');
  if (!el || el.hidden) return;
  el.hidden = true;
  document.body.classList.remove('sm-open');
  if (hasViewParam()) setView(null);
}
// Con el lightbox abierto encima, Escape cierra la foto y deja la ficha donde estaba.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || document.querySelector('.lightbox.open')) return;

});

function smBodyHtml(d) {
  const cc = { '🇯🇵': 'jp', '🇰🇷': 'kr' };
  const gal = (d.imgs && d.imgs.length) ? d.imgs : (d.img ? [d.img] : []);
  const flag = (d.flag && cc[d.flag]) ? '<img class="sm-flag" src="https://flagcdn.com/' + cc[d.flag] + '.svg" alt="">' : '';
  const meta = isPendingStop(d) ? DX(d.pendingNote || d.dates)
    : d.type === 'fullday' ? (DX(d.dates + ' · ') + 'pasar el día')
    : (DX(d.dates + ' · ') + d.nights + ' noches');
  // La ficha muestra las 3 primeras, pero el lightbox recorre la galería entera del destino.
  galleries['sm:' + d.id] = gal;
  const hero = gal.length
    ? '<div class="sm-hero">' + gal.slice(0, 3).map((u, gi) =>
        '<img src="' + u + '" loading="lazy" data-gal="sm:' + d.id + '" data-gi="' + gi + '" alt="">').join('') + '</div>'
    : '';
  const leg = d.leg ? '<div class="sm-sec"><div class="card-section-title">Cómo se llega</div><div class="sm-leg"><span class="sm-leg-mode">' + (d.leg.mode || '') + '</span> ' + (d.leg.time ? '<b>' + d.leg.time + '</b> · ' : '') + (d.leg.detail || '') + '</div>' + legSegsHtml(d.leg) + '</div>' : '';
  const cityActs = cityActivities(d);
  const cityDts = cityDaytrips(d);
  const visits = cityGroupOf(d).length;
  const sharedNote = visits > 1
    ? '<span class="qh-shared">' + escHtml(cityLabel(d)) + ' · las ' + visits + ' visitas</span>' : '';
  const acts = cityActs.length
    ? '<div class="sm-sec"><div class="card-section-title">Qué hacer · ' + cityActs.length + sharedNote + '</div>' +
        activityCatalogHtml(cityActs, d, false) +
      '</div>'
    : '';
  const dts = cityDts.length
    ? '<div class="sm-sec"><div class="card-section-title">Day trips</div><ul class="card-list">' +
        cityDts.map(t => '<li>' + (t.url ? '<a class="sm-act" href="' + t.url + '" target="_blank" rel="noopener">' + t.name + ' ↗</a>' : t.name) + (t.desc ? '<div class="sm-dt-desc">' + t.desc + '</div>' : '') + '</li>').join('') +
      '</ul></div>'
    : '';
  return (
    '<div class="sm-head">' + flag + '<div><h2 class="sm-title">' + d.name + '</h2><div class="sm-meta">' + meta + sharedTag(d) + '</div></div></div>' +
    hero +
    '<div id="sm-map" class="sm-map"></div>' +
    (d.intro ? '<p class="sm-intro">' + DX(d.intro, maskFree(d.intro)) + '</p>' : '') +
    (lodgingHtml(d.lodging, d.short, 'sm-' + d.id) || (d.lodgingTbd ? lodgingTbdHtml(d.lodgingTbd) : '')) + leg + acts + dts
  );
}
function buildStopMiniMap(d, idx) {
  const c = document.getElementById('sm-map');
  if (!c) return;
  if (_smMap) { _smMap.remove(); _smMap = null; }  // el contenedor se recrea en cada apertura
  _smMap = L.map(c, { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
  L.tileLayer(CARTO_TILES, { subdomains: 'abcd', maxZoom: 19 }).addTo(_smMap);
  _smLayer = L.layerGroup().addTo(_smMap);
  const pts = [];
  const a0 = prevInChain(d);
  if (a0 && d.leg) {  // tramo de llegada, por modo real
    const a = a0;
    let subsegs;
    if (d.leg.path) { let from = a.coords; subsegs = d.leg.path.map(s => { const seg = { pts: [from, s.to], mode: s.m }; from = s.to; return seg; }); }
    else { subsegs = [{ pts: [a.coords].concat(d.leg.via || []).concat([d.coords]), mode: legType(d.leg) }]; }
    subsegs.forEach(seg => { L.polyline(seg.pts, styleFor(seg.mode)).addTo(_smLayer); seg.pts.forEach(p => pts.push(p)); });
  }
  L.marker(d.coords, { icon: L.divIcon({ html: '<div class="marker-num' + (isPendingStop(d) ? ' pending' : '') + (d.sharedWith ? ' shared' : '') + '">' + (d.n || '?') + '</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(_smLayer);
  pts.push(d.coords);
  cityActivities(d).forEach(({ act: a }) => { if (a.coords) { L.circleMarker(a.coords, { radius: 5, color: catColor(catOfAct(a)), weight: 2, fillColor: catColor(catOfAct(a)), fillOpacity: 0.85 }).addTo(_smLayer).bindPopup(a.text); pts.push(a.coords); } });
  cityDaytrips(d).forEach(t => { if (t.coords) { L.circleMarker(t.coords, { radius: 5, color: catColor(catOf(t.name, t.cat)), weight: 2.5, fillColor: '#fff', fillOpacity: 1 }).addTo(_smLayer).bindPopup(t.name); pts.push(t.coords); } });
  if (d.lodging && d.lodging.coords) { const lc = isDiscrete() ? maskedLodgingCoords(d) : d.lodging.coords; L.marker(lc, { icon: L.divIcon({ html: '<div class="lodging-marker">🛏️</div>', className: '', iconSize: [28, 28], iconAnchor: [14, 14] }) }).addTo(_smLayer).bindPopup(lodgingPopupHtml(d.lodging, d.short)); pts.push(lc); }
  setTimeout(() => { _smMap.invalidateSize(); try { _smMap.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 12 }); } catch (e) { _smMap.setView(d.coords, 10); } }, 60);
}
function _wireShare(el, kind, id) {
  const sb = el.querySelector('.sm-share');
  sb.classList.remove('copied'); sb.innerHTML = '🔗 Copiar link';
  sb.onclick = () => {
    const link = shareUrl(kind, id);
    const done = () => { sb.classList.add('copied'); sb.innerHTML = '✓ Link copiado'; setTimeout(() => { sb.classList.remove('copied'); sb.innerHTML = '🔗 Copiar link'; }, 1700); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(() => prompt('Copiá el link:', link));
    else prompt('Copiá el link:', link);
  };
}
function _showModal(el) { el.hidden = false; document.body.classList.add('sm-open'); el.querySelector('.sm-dialog').scrollTop = 0; }

function openStopModal(id) {
  const idx = destinations.findIndex(x => x.id === id);
  if (idx < 0) return;
  const d = destinations[idx];
  const el = ensureStopModal();
  el.querySelector('.sm-content').innerHTML = smBodyHtml(d);
  _wireShare(el, 'stop', d.id);
  _showModal(el);
  setView('stop', id);
  buildStopMiniMap(d, idx);
}

// Ficha de un TRAMO de transporte: modo, duración, segmentos + mini-mapa de la ruta real.

  return (
    '<div class="sm-head"><div class="sm-leg-badge" style="background:' + lt.color + '">' + d.leg.mode + '</div>' +
      '<div><h2 class="sm-title">' + origin + ' → ' + d.short + '</h2>' +
      '<div class="sm-meta">' + lt.label + ' · ' + d.leg.time + DX(' · llega ' + segStartDate(d.dates)) + '</div></div></div>' +
    '<div id="sm-map" class="sm-map"></div>' +
    '<p class="sm-intro">' + d.leg.detail + '</p>' +

    (dir ? '<div class="sm-sec">' + dir + '</div>' : '')
  );

function buildLegMiniMap(d, idx) {
  const c = document.getElementById('sm-map'); if (!c) return;

// "escondé los saltos" y ahora eso es `transporte`. Se traduce en vez de ignorarse,
// para que el link compartido siga aterrizando con el mapa como quien lo mandó lo vio.
const LEGACY_LAYER_KEYS = { vuelos: 'transporte' };
// Sin estado en la URL el mapa aterriza SOLO con Actividades: las cuatro familias
// juntas lo saturaban (Martín, 2026-09-03) y los hospedajes también sobraban en el

// que significa "todo prendido"— es intención explícita de quien armó el link y
// manda sobre este default.
const DEFAULT_LAYERS_OFF = 'destinos,hospedaje,transporte';
const savedLayersOff = new URLSearchParams(location.search).get('layersOff');
const inactiveLayers = new Set((savedLayersOff === null ? DEFAULT_LAYERS_OFF : savedLayersOff).split(',')
  .map(k => LEGACY_LAYER_KEYS[k] || k)
  .filter(k => TOGGLES.some(t => t.key === k)));
const layerBtns = {};
let allLayersBtn = null;

const layerOn = key => !inactiveLayers.has(key);
const allLayersOn = () => inactiveLayers.size === 0;

function writeLayersUrl() {
  const u = new URL(location.href);
  const off = TOGGLES.filter(x => inactiveLayers.has(x.key)).map(x => x.key).join(',');
  // Estado == default → URL limpia. Cualquier otro estado se escribe SIEMPRE,
  // incluso "todo prendido" (`layersOff=` vacío): sin eso, recargar o compartir
  // con todo a la vista volvería calladamente al default.
  if (off === DEFAULT_LAYERS_OFF) u.searchParams.delete('layersOff');
  else u.searchParams.set('layersOff', off);
  history.replaceState(null, '', u);
}

// Prender/apagar una familia. `inactiveLayers` es la INTENCIÓN del usuario y el
// botón la refleja siempre; mientras el foco de día tiene tomado el mapa la
// intención se guarda pero no se aplica — se aplica al salir del foco.
function setLayer(key, on) {
  const t = TOGGLES.find(x => x.key === key);
  if (!t) return;
  on ? inactiveLayers.delete(key) : inactiveLayers.add(key);
  if (key === 'transporte') map.getContainer().classList.toggle('no-legs', !on);
  const btn = layerBtns[key];
  if (btn) { btn.classList.toggle('active', on); btn.setAttribute('aria-pressed', String(on)); }
  if (!dayFocus) t.layers.forEach(l => on ? map.addLayer(l) : map.removeLayer(l));
  if (allLayersBtn) {
    allLayersBtn.classList.toggle('active', allLayersOn());
    allLayersBtn.setAttribute('aria-pressed', String(allLayersOn()));

// ------------------------------------------------------- foco de día (task 508)
// Tocar un día en la vista Días toma el mapa: se apagan todas las familias y quedan
// sólo los puntos de esa jornada, unidos por la línea del recorrido en el MISMO orden
// en que la lista los enumera (la vista arma ese orden y lo manda acá — ver dayRoute()
// en views.js). No es ruteo por calles: es la guía visual de "qué sigue a qué".
// Salir devuelve el mapa como estaba: capas, categorías y encuadre.
const focusLayer = L.layerGroup();
let dayFocus = null;          // { date, prev: {center, zoom}, shown: [markers] }
let dayExitHandler = null;    // lo registra views.js para que salir también toque la URL

const dayChip = document.createElement('div');
dayChip.className = 'day-chip';
const dayChipBtn = document.createElement('button');
dayChipBtn.type = 'button';
dayChipBtn.addEventListener('click', () => { dayExitHandler ? dayExitHandler() : exitDayFocus(); });
dayChip.appendChild(dayChipBtn);

// El número del recorrido, pintado con el color de la categoría del punto: es el
// mismo círculo que la lista de la jornada pone delante del ítem.
const ordIcon = (n, color, emoji, cls) => L.divIcon({
  html: '<div class="rt-ord' + (cls ? ' ' + cls : '') + '" style="background:' + color + ';--c:' + color + '">' + n +
    (emoji ? '<span class="rt-ord-cat" aria-hidden="true">' + emoji + '</span>' : '') + '</div>',
  className: '', iconSize: [30, 30], iconAnchor: [15, 15],
});

// Un punto que el foco muestra directo sobre el mapa (su layerGroup está apagado).
// Se anota en `shown` para poder sacarlo al salir sin tocar el grupo del que salió.
function showFocused(m) {
  if (!m || !dayFocus || dayFocus.shown.includes(m)) return false;
  map.addLayer(m);
  dayFocus.shown.push(m);
  return true;
}

// La punta de un traslado: el aeropuerto / la estación / el puerto por donde se entra o
// se sale de la ciudad ese día. Vive sólo mientras dura el foco (es una punta de ESE
// día): el pin de aeropuerto de la capa de vuelos no cubre estaciones ni puertos, y con
// el foco tomado esa capa está apagada igual.
const termIcon = t => t.icon || (MODE_STYLE[t.mode] || MODE_STYLE.train).icon;
function terminalMarker(t) {
  const icon = L.divIcon({
    html: '<div class="term-marker">' + termIcon(t) + '</div>',
    className: '', iconSize: [24, 24], iconAnchor: [12, 12],
  });
  return L.marker(t.coords, { icon, zIndexOffset: 1100 })
    .bindPopup('<div class="popup-title">' + termIcon(t) + ' ' + t.name + '</div>');
}

// spec = { date, label, route: [{ key, cat }, ...] EN ORDEN DE RECORRIDO,
//          line: [ítems del trazo, en orden], stops: [ids], legs: [ids de tramo] }
// El orden lo decide la vista (dayRoute() en views.js, que ordena por geografía); acá
// sólo se dibuja. `line` es el trazo entero y cada ítem es una de tres cosas: `{ bed }`
// (un hospedaje — la cama de anoche o la de esta noche; cuando son la misma, la línea
// cierra el círculo), `{ terminal }` (la punta de un traslado del día) o una parada del
// recorrido, de la que se leen `key` y `cat` y nada más. El mapa no sabe de itinerario.
function enterDayFocus(spec) {
  if (!spec) return;
  // Cambiar de día no re-guarda el encuadre: el "volver" es al mapa previo al foco.
  const prev = dayFocus ? dayFocus.prev : { center: map.getCenter(), zoom: map.getZoom() };
  clearDayFocusLayers();
  dayFocus = { date: spec.date, prev, shown: [], catMarkers: [], ordMarkers: [] };
  TOGGLES.forEach(t => t.layers.forEach(l => map.removeLayer(l)));
  // El foco apaga el transporte del viaje entero, pero el salto de ESE día es parte de
  // la jornada: su línea se queda —y con ella el click a su ficha—. Los pines del día
  // entran sin importar los toggles de familia, pero los chips de categoría sí les
  // hablan (task 697): cada uno queda anotado en `catMarkers` con su categoría para
  // que `applyCatFilter` los prenda y apague también durante el foco.
  (spec.legs || []).forEach(id => (legSegments[id] || []).forEach(s => { showFocused(s.pl); showFocused(s.hit); }));

  const line = [], ord = [];
  const step = m => { if (m) { showFocused(m); line.push(m.getLatLng()); return m.getLatLng(); } };
  (spec.line || []).forEach(p => {
    if (p.bed) { step(lodgingMarkers[p.bed]); return; }
    if (p.terminal) { terminalMarker(p.terminal).addTo(focusLayer); line.push(L.latLng(p.terminal.coords)); return; }
    const m = actMarkers[p.key];
    const ll = step(m);
    if (ll) {
      ord.push({ ll, cat: p.cat, color: catColor(p.cat), emoji: (CAT_META[p.cat] || CAT_META.otro).icon, number: p.planNumber, key: p.key });
      dayFocus.catMarkers.push({ m, cat: p.cat, holder: map });
    }
  });
  // La parada del día entra SÓLO si el día no tiene paradas propias (traslado, llegada
  // sin nada cargado): si no, su número compite con el del recorrido y el centroide de
  // la ciudad no dice nada que los puntos no digan ya. Con las camas no alcanza —dos
  // pines de hotel no cuentan qué pasó ese día—, por eso mira `ord` y no `line`.
  const ctxPts = [];
  if (!ord.length) (spec.stops || []).forEach(id => {
    const m = markers[id];
    if (m && showFocused(m)) ctxPts.push(m.getLatLng());
  });

  if (line.length > 1) {
    // No se toca (`interactive: false`): es la guía del día, no un objeto con ficha. Y
    // desde que las puntas son las terminales del salto, el tramo del día queda
    // exactamente DEBAJO de este trazo — si tomara clicks, taparía el de su línea, que
    // es lo que abre la ficha del transporte.
    L.polyline(line, { color: '#0F6E56', weight: 3, opacity: 0.7, dashArray: '7, 6', lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(focusLayer);
  }
  // Numeradas van las paradas, no las camas: el recorrido es lo que se visita. Va
  // incluso con una sola, para que el "1" de la lista tenga su punto en el mapa.
  // El número filtra junto con su pin: apagar la categoría apaga el círculo también.
  ord.forEach((p, i) => {
    // El número de una parada ya tachada nace atenuado; el pin de abajo (actMarkers)
    // trae su propio atenuado, así el par entero descansa.
    const m = L.marker(p.ll, { icon: ordIcon(p.number || i + 1, p.color, p.emoji, checkedActivities.has(p.key) ? 'pp-done' : ''), interactive: false, zIndexOffset: 1200 }).addTo(focusLayer);
    dayFocus.catMarkers.push({ m, cat: p.cat, holder: focusLayer });
    dayFocus.ordMarkers.push({ m, key: p.key, n: p.number || i + 1, color: p.color, emoji: p.emoji, done: checkedActivities.has(p.key) });
  });
  focusLayer.addTo(map);

  dayChipBtn.innerHTML = '✕ ' + spec.label;   // `label` trae el DX de la fecha
  map.getContainer().classList.add('day-focus');
  // En mobile el mapa está arriba del sidebar y puede haber quedado fuera de la
  // pantalla: enfocar un día sin que se vea el mapa no muestra nada.
  if (map.getContainer().getBoundingClientRect().bottom < 80) {
    map.getContainer().scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  // Encuadre: manda el recorrido, camas incluidas —son sus puntas—. La ciudad entra
  // sólo cuando no hay paradas, porque si no un centroide lejano desarma el zoom.
  const fit = line.concat(ctxPts);
  if (fit.length === 1) map.flyTo(fit[0], 14, { duration: 0.7 });
  else if (fit.length) map.flyToBounds(L.latLngBounds(fit), { padding: [70, 70], maxZoom: 15, duration: 0.7 });
  // El filtro es uno solo: entrar al foco con una categoría apagada la respeta acá
  // también (el encuadre no — sigue mostrando el recorrido entero, que no baila).
  applyCatFilter(true);
}

// Tachar con el foco de día puesto: el número de la parada se re-arma con (o sin) su
// clase de tachado. El pin de la actividad lo cubre syncDonePins, que es el mismo marker.
function syncDayFocusDone() {
  if (!dayFocus) return;
  dayFocus.ordMarkers.forEach(o => {
    const done = checkedActivities.has(o.key);
    if (o.done === done) return;
    o.done = done;
    o.m.setIcon(ordIcon(o.n, o.color, o.emoji, done ? 'pp-done' : ''));
  });
}

function clearDayFocusLayers() {
  if (dayFocus) dayFocus.shown.forEach(m => map.removeLayer(m));
  focusLayer.clearLayers();
  map.removeLayer(focusLayer);
}

function exitDayFocus() {
  if (!dayFocus) return;
  const prev = dayFocus.prev;
  clearDayFocusLayers();
  dayFocus = null;
  // Volver a la intención del usuario, no a "todo prendido": las familias apagadas
  // antes del foco siguen apagadas, y las categorías filtradas siguen filtradas
  // (sus pines nunca volvieron a su layerGroup).
  TOGGLES.forEach(t => { if (layerOn(t.key)) t.layers.forEach(l => map.addLayer(l)); });
  map.getContainer().classList.remove('day-focus');
  map.flyTo(prev.center, prev.zoom, { duration: 0.6 });
}

const barsWrap = document.createElement('div');

// Filtro por categoría — los chips son a la vez la leyenda de color de los pines.
// Con todo prendido, un click aísla esa categoría; después cada click suma o saca.
// El estado va a la URL (?cat=comida,bar-noche) para poder compartir la vista.
//
// El estado es UNO SOLO (task 697): la barra de la portada y la del mapita de la
// jornada leen y escriben el mismo `activeCats` — filtrar en una y mirar la otra
// muestra lo mismo. Por eso las barras se fabrican acá (`buildCatBar`) y se anotan
// en `catBars`, para que `applyCatFilter` les sincronice el estado a todas.
const activeCats = new Set(CAT_ORDER);
const catBars = [];
function buildCatBar() {

  bar.className = 'map-cats';

  // no prendería ni apagaría nada (en China varias de la taxonomía aún no se usan).
  const usedCats = new Set(placePins.map(p => p.cat));
  CAT_ORDER.filter(c => usedCats.has(c)).forEach(c => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mc';
    btn.innerHTML = '<span class="mc-dot" style="--c:' + catColor(c) + '"></span>' + CAT_META[c].label;
    btn.addEventListener('click', () => {
      if (activeCats.size === CAT_ORDER.length) { activeCats.clear(); activeCats.add(c); }
      else if (activeCats.has(c)) activeCats.delete(c);
      else activeCats.add(c);
      applyCatFilter();
    });
    btns[c] = btn;
    bar.appendChild(btn);
  });
  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'mc mc-all';
  allBtn.textContent = 'Todo';
  allBtn.addEventListener('click', () => { CAT_ORDER.forEach(c => activeCats.add(c)); applyCatFilter(); });
  bar.appendChild(allBtn);
  const entry = { bar, btns, allBtn };

barsWrap.appendChild(buildCatBar().bar);

// El mapa embebido de la jornada y sus piezas viven declarados acá arriba porque
// `applyCatFilter` los toca y corre antes de que `renderDayMap` exista siquiera
// (el deep-link de ?cat= la llama al cargar la página).
let _dayViewMap = null;
let _dayViewMarkers = {};
let _dayViewSuggestions = [];   // { m, cat } — sólo candidatas; el plan no filtra
let _dayViewCatBar = null;

function applyCatFilter(skipUrl) {
  placePins.forEach(p => {
    const on = activeCats.has(p.cat);
    if (on && !p.layer.hasLayer(p.m)) p.layer.addLayer(p.m);
    else if (!on && p.layer.hasLayer(p.m)) p.layer.removeLayer(p.m);
  });
  // En foco de día los pines de la jornada están sueltos sobre el mapa (sus
  // layerGroups quedaron apagados), así que se prenden/apagan uno por uno. Camas,
  // terminales y tramos no tienen categoría: quedan siempre.
  if (dayFocus) dayFocus.catMarkers.forEach(e => {
    const on = activeCats.has(e.cat);
    if (on && !e.holder.hasLayer(e.m)) e.holder.addLayer(e.m);
    else if (!on && e.holder.hasLayer(e.m)) e.holder.removeLayer(e.m);
  });
  // En el mapita de la jornada filtran SOLO las sugerencias: los promovidos y las
  // anclas son plan, no candidatas, y se dibujan siempre.
  if (_dayViewMap) _dayViewSuggestions.forEach(s => {
    const on = activeCats.has(s.cat);
    if (on && !_dayViewMap.hasLayer(s.m)) s.m.addTo(_dayViewMap);
    else if (!on && _dayViewMap.hasLayer(s.m)) _dayViewMap.removeLayer(s.m);
  });
  catBars.forEach(b => {
    // Las categorías vacías no tienen chip (ver buildCatBar): sincronizar sólo los que existen.
    CAT_ORDER.forEach(c => { if (b.btns[c]) b.btns[c].classList.toggle('off', !activeCats.has(c)); });
    b.allBtn.hidden = activeCats.size === CAT_ORDER.length;
  });
  syncPinEmojis();
  if (skipUrl) return;
  const u = new URL(location.href);
  if (activeCats.size === CAT_ORDER.length) u.searchParams.delete('cat');
  else u.searchParams.set('cat', CAT_ORDER.filter(c => activeCats.has(c)).join(','));
  history.replaceState(null, '', u);
}
(function () {  // deep-link: ?cat=comida,bar-noche aterriza ya filtrado
  const s = new URLSearchParams(location.search);
  let stale = false;
  if (s.has('cat')) {
    const want = s.get('cat').split(',').map(c => c.trim()).filter(c => CAT_META[c]);
    if (want.length) { activeCats.clear(); want.forEach(c => activeCats.add(c)); }
    // Ninguna categoría válida (link viejo, categoría renombrada): mostrar todo
    // en vez de un mapa vacío, y limpiar el parámetro muerto de la URL.
    else stale = true;
  }
  applyCatFilter(!stale);
})();

// Si la URL trae ?stop=<id> o ?leg=<id>, abrir la ficha (modal) correspondiente (vista compartible).
(function () {
  const s = new URLSearchParams(location.search);
  const stop = s.get('stop'), leg = s.get('leg');
  if (stop && destinations.some(d => d.id === stop)) setTimeout(() => openStopModal(stop), 300);
  else if (leg && destinations.some(d => d.id === leg)) setTimeout(() => openLegModal(leg), 300);
})();

// Número de reserva: tap para copiarlo. Es el dato que se dice en el mostrador y
// tipearlo de un teléfono es justo lo que no se quiere hacer parado en un lobby.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.resv-ref');
  if (!btn) return;
  e.stopPropagation();
  const txt = btn.dataset.copy || btn.textContent;
  const ok = () => { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 1400); };
  // Sin Clipboard API (Safari viejo, contexto no seguro): seleccionar + execCommand. Si
  // tampoco copia, el número queda seleccionado y se copia con el menú del sistema — pero
  // no se dice "copiado", que sería mentira.
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(btn);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { if (document.execCommand('copy')) ok(); } catch (err) {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
  else fallback();
});

// Cuándo se movió por última vez un carrusel: lo escribe el módulo de más abajo y lo lee
// el lightbox, para no abrirse con el click con el que termina un swipe.
let lastCarouselScroll = 0;

// Lightbox para las galerías de fotos (click en una foto → se expande y se recorren las
// demás de ese hospedaje/destino). El listener va en `document` porque las fotos aparecen
// en el acordeón, en la ficha de parada y en las vistas laterales.
// El lightbox NO tiene URL propia (es transitorio), pero sí empuja una entrada de historia
// para que el "atrás" del celular lo cierre en vez de sacarte del sitio.
(function () {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = '<span class="lb-btn lb-close">×</span><span class="lb-btn lb-prev">‹</span>' +
    '<img class="lb-img" alt=""><span class="lb-btn lb-next">›</span>';
  document.body.appendChild(lb);
  const img = lb.querySelector('.lb-img');
  let cur = [], idx = 0, pushed = false;
  const show = () => { img.src = cur[idx]; };
  const step = (n) => { if (cur.length) { idx = (idx + n + cur.length) % cur.length; show(); } };
  const open = (list, i) => {
    if (!list || !list.length) return;
    cur = list; idx = i;
    show();
    lb.classList.toggle('single', cur.length < 2);   // con una sola foto no hay flechas
    lb.classList.add('open');
    if (!pushed) { history.pushState({ lb: 1 }, '', location.href); pushed = true; }
  };
  // `back: false` = ya volvimos (el popstate nos trajo acá), no hay que pedir otro atrás.
  const close = (back = true) => {
    if (!lb.classList.contains('open')) return;
    lb.classList.remove('open'); img.src = '';
    const undo = pushed && back;
    pushed = false;
    if (undo) history.back();
  };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-gal]');
    if (!t) return;
    e.stopPropagation();
    open(galleries[t.dataset.gal], +t.dataset.gi);
  });
  window.addEventListener('popstate', () => close(false));
  // Un swipe que termina sobre la foto no tiene que abrir el lightbox. En captura y con
  // `stopImmediatePropagation` porque el listener de arriba también vive en `document`.
  document.addEventListener('click', (e) => {
    if (e.target.closest('.lgc-track') && performance.now() - lastCarouselScroll < 350) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  }, true);
  lb.querySelector('.lb-close').addEventListener('click', () => close());
  lb.querySelector('.lb-prev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  lb.querySelector('.lb-next').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
})();

// ---- Carrusel de fotos del hospedaje ---------------------------------------
// Un solo par de listeners para todos los carruseles del documento —el acordeón, la ficha
// de parada y la vista Hospedajes dibujan el mismo alojamiento y se montan/desmontan solos—,
// igual que el lightbox. El movimiento lo hace el scroll nativo: acá sólo se lo empuja con
// las flechas y se sincronizan los puntos, venga del dedo o del click.
(function carousels() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.lgc-nav');
    if (!b) return;
    e.stopPropagation();
    const track = b.parentElement.querySelector('.lgc-track');
    track.scrollBy({ left: (+b.dataset.lgc) * track.clientWidth, behavior: 'smooth' });
  });
  // `scroll` no burbujea: se escucha en captura o no llega nunca a `document`.
  document.addEventListener('scroll', (e) => {
    const track = e.target;
    if (!track.classList || !track.classList.contains('lgc-track')) return;
    lastCarouselScroll = performance.now();
    const box = track.parentElement;
    const dots = box.querySelectorAll('.lgc-dots i');
    const i = track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0;
    dots.forEach((d, j) => d.classList.toggle('on', j === i));
    box.classList.toggle('at-start', i <= 0);
    box.classList.toggle('at-end', i >= dots.length - 1);
  }, true);
})();

// Panel de temperatura colapsado por default; resize del chart al abrir (Chart.js

  const tgl = document.getElementById('chart-toggle');
  const wrap = document.getElementById('chart-wrap');
  if (tgl && wrap) {

// Toggle del modo discreto: botón 🙈 del header o tecla `d`; persiste en localStorage.
// Mueve los pines de cama al centro de su parada y re-renderiza la ficha si está abierta
// (los pares .dx/.dm del resto de la UI se alternan solos por CSS).
(function () {
  const btn = document.getElementById('discrete-toggle');
  function applyDiscrete(on) {
    document.body.classList.toggle('discrete', on);
    lodgingPins.forEach(p => p.mk.setLatLng(on ? p.masked : p.real));
    map.closePopup();
    try { localStorage.setItem(DISCRETE_KEY, on ? '1' : '0'); } catch (e) {}
    const s = new URLSearchParams(location.search);
    if (s.get('stop')) openStopModal(s.get('stop'));
    else if (s.get('leg')) openLegModal(s.get('leg'));
  }
  btn.addEventListener('click', () => applyDiscrete(!isDiscrete()));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'd' && e.key !== 'D') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    applyDiscrete(!isDiscrete());
  });
  let saved = null;
  try { saved = localStorage.getItem(DISCRETE_KEY); } catch (e) {}
  if (saved === '1') applyDiscrete(true);
})();

// ── Mi ubicación ────────────────────────────────────────────────────────────
// Punto azul + círculo de precisión sobre el mapa del viaje, para caminar por
// Beijing o Shenzhen y ver qué pin del viaje tenés al lado. El permiso se pide SOLO
// al tocar el botón (nunca al cargar) y la posición vive en memoria: no se
// guarda en localStorage ni sale de la página.
//
// Botón (esquina inferior derecha): tap 1 = prender · tap 2 = seguir (el mapa se
// centra en cada update) · tap 3 = apagar. Arrastrar el mapa sale del modo seguir.
// Con fix activo, cada popup de punto suma "a X m/km" y el punto azul abre la
// lista de los 5 lugares visibles más cercanos.
(function () {
  const meLayer = L.layerGroup().addTo(map);
  let meMarker = null, meCircle = null, mePos = null, meWatch = null, meState = 'off';
  let stampTarget = null, nearShown = [];

  const meBtn = document.createElement('button');
  meBtn.type = 'button';
  meBtn.className = 'me-btn';
  meBtn.title = 'Mi ubicación';
  meBtn.setAttribute('aria-label', 'Mi ubicación');
  meBtn.setAttribute('aria-pressed', 'false');
  meBtn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="7"/><path d="M12 1.5v3M12 19.5v3M22.5 12h-3M4.5 12h-3"/>' +
      '<circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>' +
    '</svg>';
  map.getContainer().appendChild(meBtn);
  L.DomEvent.disableClickPropagation(meBtn);

  const toastEl = document.createElement('div');
  toastEl.className = 'map-toast';
  toastEl.setAttribute('role', 'status');
  map.getContainer().appendChild(toastEl);
  let toastT = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  function fmtDist(km) {
    if (km < 1) return Math.round(km * 1000) + ' m';
    return (km < 10 ? km.toFixed(1) : Math.round(km)) + ' km';
  }

  // "Cerca tuyo" mira sólo lo que está EN el mapa: respeta los toggles de capa y
  // el filtro por categoría, así la lista siempre coincide con los pines visibles.
  function nearest(n) {
    if (!mePos) return [];
    return nearPts
      .filter(p => map.hasLayer(p.m))
      .map(p => {
        const ll = p.m.getLatLng();
        return { p: p, km: kmBetween(mePos.lat, mePos.lng, ll.lat, ll.lng) };
      })
      .sort((a, b) => a.km - b.km)
      .slice(0, n);
  }
  function nearLabel(p) { return (isDiscrete() && p.masked) ? p.masked : p.label; }
  function nearHtml() {
    nearShown = nearest(5);
    if (!nearShown.length) return '<div class="near"><div class="near-empty">Sin puntos del viaje cerca</div></div>';
    return '<div class="near">' + nearShown.map((e, i) =>
      '<button type="button" class="near-row" data-i="' + i + '">' +
        '<span class="near-dot" style="background:' + e.p.color + '"></span>' +
        '<span class="near-name">' + escHtml(nearLabel(e.p)) + '</span>' +
        '<span class="near-km">' + fmtDist(e.km) + '</span>' +
      '</button>').join('') + '</div>';
  }
  function wireNear(popup) {
    const el = popup && popup.getElement();
    if (!el) return;
    el.querySelectorAll('.near-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const it = nearShown[Number(btn.dataset.i)];
        if (!it) return;
        map.closePopup();
        map.flyTo(it.p.m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.7 });
        it.p.m.openPopup();
      });
    });
  }

  // Distancia en el popup de cada punto: se estampa al abrir y se refresca con
  // cada update de posición. El popup se re-renderiza de su HTML original al
  // reabrirse, así que no hay que limpiar nada.
  function stampDist(popup) {
    const el = popup && popup.getElement && popup.getElement();
    if (!el) return;
    const wrap = el.querySelector('.mini-pop') || el.querySelector('.leaflet-popup-content');
    if (!wrap) return;
    let tag = wrap.querySelector('.popup-dist');
    const ll = popup.getLatLng && popup.getLatLng();
    if (!mePos || !ll) { if (tag) tag.remove(); return; }
    if (!tag) {
      tag = document.createElement('div');
      tag.className = 'popup-dist';
      wrap.appendChild(tag);
    }
    tag.textContent = 'a ' + fmtDist(kmBetween(mePos.lat, mePos.lng, ll.lat, ll.lng));
  }
  nearPts.forEach(p => p.m.on('popupopen', e => { stampTarget = e.popup; stampDist(e.popup); }));
  map.on('popupclose', e => { if (e.popup === stampTarget) stampTarget = null; });

  function setState(s) {
    meState = s;
    meBtn.classList.toggle('wait', s === 'wait');
    meBtn.classList.toggle('on', s === 'on');
    meBtn.classList.toggle('follow', s === 'follow');
    meBtn.setAttribute('aria-pressed', String(s !== 'off'));
  }

  function meOff() {
    if (meWatch != null) navigator.geolocation.clearWatch(meWatch);
    meWatch = null;
    mePos = null;
    meLayer.clearLayers();
    meMarker = null;
    meCircle = null;
    nearShown = [];
    setState('off');
    if (stampTarget) stampDist(stampTarget);
  }

  function drawMe(ll, acc) {
    if (meMarker) {
      meMarker.setLatLng(ll);
      meCircle.setLatLng(ll).setRadius(acc);
      return;
    }
    meMarker = L.marker(ll, {
      icon: L.divIcon({ html: '<div class="me-dot"></div>', className: '', iconSize: [16, 16], iconAnchor: [8, 8] }),
      zIndexOffset: 1200, keyboard: false, title: 'Estás acá',
    }).addTo(meLayer);
    // El autoPanPadding saca la lista de abajo de la leyenda de modos (arriba) y
    // de las barras de chips (abajo): son controles, y siempre van sobre el popup.
    meMarker.bindPopup(nearHtml, {
      closeButton: false, offset: [0, -2], minWidth: 186, maxWidth: 250,
      autoPanPaddingTopLeft: [12, 82], autoPanPaddingBottomRight: [12, 72],
    });
    meMarker.on('popupopen', e => wireNear(e.popup));
    meCircle = L.circle(ll, {
      radius: acc, color: '#1F7AE0', weight: 1, opacity: 0.35,
      fillColor: '#1F7AE0', fillOpacity: 0.1, interactive: false,
    }).addTo(meLayer);
    meCircle.bringToBack();
  }

  function onFix(pos) {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    const first = !mePos;
    mePos = ll;
    drawMe(ll, pos.coords.accuracy || 0);
    if (meState === 'wait') setState('on');
    // El mapa arranca mostrando el viaje entero: al primer fix acercamos a
    // escala de barrio, si no el punto azul se pierde entre los pines. Si ya
    // estabas mirando de cerca tu zona, no te movemos la vista.
    if (first) {
      if (map.getZoom() < 12 || !map.getBounds().contains(ll)) map.setView(ll, Math.max(map.getZoom(), 14));
    } else if (meState === 'follow') {
      map.panTo(ll);   // seguir = mantener el punto centrado, sin tocarte el zoom
    }
    if (stampTarget) stampDist(stampTarget);
    if (meMarker.isPopupOpen()) {
      meMarker.setPopupContent(nearHtml());
      wireNear(meMarker.getPopup());
    }
  }

  function onErr(err) {
    // Con un fix ya obtenido, un timeout suelto del watch no apaga nada.
    if (mePos && err.code !== 1) return;
    meOff();
    toast(err.code === 1
      ? 'Ubicación bloqueada — habilitala en el navegador'
      : 'No se pudo obtener tu ubicación');
  }

  meBtn.addEventListener('click', () => {
    if (meState === 'off') {
      if (!navigator.geolocation) { toast('Este navegador no comparte ubicación'); return; }
      setState('wait');
      meWatch = navigator.geolocation.watchPosition(onFix, onErr,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
      return;
    }
    if (meState === 'wait') { meOff(); return; }            // cancelar mientras busca
    if (meState === 'on') {                                  // prendido → seguir
      setState('follow');
      if (mePos) map.setView(mePos, Math.max(map.getZoom(), 15));
      return;
    }
    meOff();                                                 // siguiendo → apagado
  });
  map.on('dragstart', () => { if (meState === 'follow') setState('on'); });
})();

// Mapa embebido de la vista individual de día. Consume el mismo `dayRoute()` que el
// foco del mapa principal: no vuelve a calcular orden ni coordenadas. Las únicas
// resoluciones que hace son cama → coords del hospedaje y parada → coords del nodo.
// (Su estado —`_dayViewMap` y compañía— está declarado junto a `activeCats`, arriba:
// `applyCatFilter` lo toca y corre antes de que este bloque exista.)
function renderDayMap(container, spec) {
  if (_dayViewMap) { _dayViewMap.remove(); _dayViewMap = null; }
  if (_dayViewCatBar) { catBars.splice(catBars.indexOf(_dayViewCatBar), 1); _dayViewCatBar = null; }
  _dayViewMarkers = {};
  _dayViewSuggestions = [];
  if (!container || !spec) return;

  const coordsOf = p => {
    if (p.terminal) return p.terminal.coords || null;
    if (p.ll) return p.ll;
    if (p.bed) {
      const n = destinations.find(d => d.id === p.bed);
      if (!n || !n.lodging || !n.lodging.coords) return null;
      return isDiscrete() ? maskedLodgingCoords(n) : n.lodging.coords;
    }
    return null;
  };
  // El mapa embebido es el plan confirmado. Las camas reservadas y las terminales son
  // puntas reales del recorrido; entre las actividades entran sólo las anclas con hora.
  const line = (spec.line || []).filter(p => p.bed || p.terminal || p.anchor || p.promoted);
  const pts = line.map(coordsOf).filter(Boolean);
  const hasActivityStops = line.some(p => !p.bed && !p.terminal);
  const stopPts = (hasActivityStops ? [] : (spec.stops || [])).map(id => {
    const n = destinations.find(d => d.id === id);
    return n && n.coords;
  }).filter(Boolean);
  const boundsPts = pts.concat(stopPts);
  if (!boundsPts.length) { container.remove(); return; }

  _dayViewMap = L.map(container, {
    zoomControl: true, attributionControl: false, scrollWheelZoom: false,
  });
  wirePopupChecks(_dayViewMap);
  // Acá el emoji va siempre: las sugerencias son el catálogo acotado de esta jornada,
  // no los ~300 lugares de la portada. Su z-index las deja debajo del plan confirmado.
  container.classList.add('pins-emoji');
  L.tileLayer(CARTO_TILES, { subdomains: 'abcd', maxZoom: 19 }).addTo(_dayViewMap);
  if (pts.length > 1) L.polyline(pts, {
    color: '#0F6E56', weight: 3, opacity: 0.78, dashArray: '7, 6',
    lineCap: 'round', lineJoin: 'round', interactive: false,
  }).addTo(_dayViewMap);
  const named = (marker, name, popup) => marker
    .bindTooltip(escHtml(name), { direction: 'top', offset: [0, -6] })
    .bindPopup(popup || '<div class="popup-title">' + escHtml(name) + '</div>');
  const seen = new Set();
  line.forEach(p => {
    const ll = coordsOf(p);
    if (!ll) return;
    if (p.bed) {
      if (seen.has('bed:' + p.bed)) return;
      seen.add('bed:' + p.bed);
      const n = destinations.find(d => d.id === p.bed);
      if (!n || !n.lodging) return;
      const name = isDiscrete() ? 'Reservado' : n.lodging.name;
      const icon = L.divIcon({
        html: '<div class="lodging-marker">🛏️</div>',
        className: '', iconSize: [28, 28], iconAnchor: [14, 14],
      });
      named(L.marker(ll, { icon }).addTo(_dayViewMap), name, lodgingPopupHtml(n.lodging, n.short));
      return;
    }
    if (p.terminal) {
      const name = p.terminal.name || 'Terminal';
      const mode = MODE_STYLE[p.terminal.mode] || {};
      named(terminalMarker(p.terminal).addTo(_dayViewMap), name,
        miniPopup(null, escHtml(name), [mode.icon, mode.label || 'Terminal'].filter(Boolean).join(' '), gmapsLink(name, ll)));
      return;
    }
    const name = p.act && p.act.text ? p.act.text : 'Parada';
    const cat = CAT_META[p.cat] || CAT_META.otro;
    const sub = p.time || (cat.icon + ' ' + cat.label);
    // Una parada del plan ya tachada sigue en el recorrido (promoverla fue una
    // decisión), pero su pin descansa: `pp-done` sobre el número o sobre el disco.
    const done = checkedActivities.has(p.key);
    const icon = p.planNumber ? ordIcon(p.planNumber, cat.color, cat.icon, done ? 'pp-done' : '')
      : placeIcon(p.cat, 'save', p.key, done ? 'pp-done' : '');
    const marker = named(L.marker(ll, { icon, zIndexOffset: p.planNumber ? 1200 : -1000 }).addTo(_dayViewMap), name,
      withPopCheck(miniPopup(p.act && p.act.img, escHtml(name), escHtml(sub), gmapsLink(name, ll, gpidOf(name))), p.key));
    marker.on('popupopen', () => marker.getElement()?.querySelector('.pp, .rt-ord')?.classList.add('active'));
    marker.on('popupclose', () => marker.getElement()?.querySelector('.pp, .rt-ord')?.classList.remove('active'));
    marker._doneMeta = { done, ord: p.planNumber || 0, cat: p.cat, color: cat.color, emoji: cat.icon, cls: '' };
    _dayViewMarkers[p.key] = marker;
  });
  // Las sugerencias son la materia prima para decidir el día: se ven en el mapa pero
  // no entran en la polilínea ni en su encuadre. Las ya promovidas/ancladas se dibujaron
  // arriba con número; acá quedan sólo las candidatas y respetan el filtro global.
  // Se crean TODAS y se agrega al mapa sólo lo activo: así los chips refiltran en vivo
  // (applyCatFilter) sin volver a armar el mapa.
  (spec.route || []).forEach(p => {
    if (!p.ll || p.anchor || p.promoted || _dayViewMarkers[p.key]) return;
    const name = p.act && p.act.text ? p.act.text : 'Sugerencia';
    const cat = CAT_META[p.cat] || CAT_META.otro;
    // `pp-sug`: candidata atenuada (task 698) — el CSS de .dv-day-map la deja como
    // punto apagado y hover/popup la traen nítida. Con el popup abierto (tap, "ver
    // en el mapa") se sostiene con `.active`, que en desktop no hay hover que dure.
    // Una tachada ya no es candidata (salió de la lista) pero su punto se queda,
    // igual de apagado: desde su popup se destacha.
    const done = checkedActivities.has(p.key);
    const marker = named(L.marker(p.ll, {
      icon: placeIcon(p.cat, 'save', p.key, 'pp-sug' + (done ? ' pp-done' : '')), zIndexOffset: -1000,
    }), name,
      withPopCheck(miniPopup(p.act && p.act.img, escHtml(name), escHtml(cat.icon + ' ' + cat.label),
        gmapsLink(name, p.ll, gpidOf(name))), p.key));
    marker._doneMeta = { done, ord: 0, cat: p.cat, cls: 'pp-sug' };
    marker.on('popupopen', () => marker.getElement()?.querySelector('.pp')?.classList.add('active'));
    marker.on('popupclose', () => marker.getElement()?.querySelector('.pp')?.classList.remove('active'));
    if (activeCats.has(p.cat)) marker.addTo(_dayViewMap);
    _dayViewMarkers[p.key] = marker;
    _dayViewSuggestions.push({ m: marker, cat: p.cat });
  });
  // Las paradas confirmadas del día son contexto del recorrido, no sugerencias. Van
  // como marcadores con el mismo popup de la portada, pero no alteran la polilínea:
  // esa sigue uniendo únicamente sus puntas físicas y sus eventos anclados.
  (hasActivityStops ? [] : (spec.stops || [])).forEach(id => {
    const n = destinations.find(d => d.id === id);
    if (!n || !n.coords || seen.has('stop:' + id)) return;
    seen.add('stop:' + id);
    const icon = L.divIcon({
      html: '<div class="marker-num' + (n.sharedWith ? ' shared' : '') + '">' + (n.n || '?') + '</div>',
      className: '', iconSize: [30, 30], iconAnchor: [15, 15],
    });
    const title = (n.n ? n.n + '. ' : '') + n.short;
    named(L.marker(n.coords, { icon }).addTo(_dayViewMap), n.short,
      miniPopup(n.img, escHtml(title), n.type === 'fullday' ? 'Parada de día' : 'Destino', gmapsLink(n.short, n.coords)));
  });
  // La misma barra de chips de la portada, abajo del mapita (task 697). Es otra
  // instancia del MISMO estado: tocar acá filtra las sugerencias de arriba y deja
  // el mapa principal (y ?cat=) igual de filtrado.
  const dayBars = document.createElement('div');
  dayBars.className = 'map-bars';
  _dayViewCatBar = buildCatBar();
  dayBars.appendChild(_dayViewCatBar.bar);
  container.appendChild(dayBars);
  L.DomEvent.disableClickPropagation(dayBars);
  L.DomEvent.disableScrollPropagation(dayBars);
  applyCatFilter(true);   // pinta el estado vigente en la barra recién montada
  setTimeout(() => {
    if (!_dayViewMap) return;
    _dayViewMap.invalidateSize();
    if (boundsPts.length === 1) _dayViewMap.setView(boundsPts[0], 13);
    else _dayViewMap.fitBounds(L.latLngBounds(boundsPts), { padding: [28, 28], maxZoom: 14 });
  }, 0);
}

// Tachar/destachar con el mapita de la jornada montado: cada marker guarda en
// `_doneMeta` lo necesario para re-armar su ícono (setIcon persiste la clase en el
// html del divIcon, así sobrevive a que los chips lo saquen y devuelvan a la capa).
function syncDayMapDone() {
  if (!_dayViewMap) return;
  Object.keys(_dayViewMarkers).forEach(key => {
    const m = _dayViewMarkers[key];
    const meta = m._doneMeta;
    if (!meta) return;
    const done = checkedActivities.has(key);
    if (meta.done === done) return;
    meta.done = done;
    const cls = (meta.cls + (done ? ' pp-done' : '')).trim();
    m.setIcon(meta.ord ? ordIcon(meta.ord, meta.color, meta.emoji, cls) : placeIcon(meta.cat, 'save', key, cls));
    keepActive(m);
  });
}

// ---- Vistas laterales (task 499) -------------------------------------------
// Las tres vistas nuevas leen el mismo `destinations` y reusan los bloques que ya
// existen acá (reserva, categorías, escape de HTML). Si esto falla, el resumen
// —que es todo lo que había antes— tiene que seguir funcionando igual.
try {
  mountViews(destinations, {
    escHtml, resvHtml, resvUrl, RESV_PROVIDER, hoursParts, lodgingLinks, carouselHtml,
    // Mismo lightbox que el resumen: la vista registra su galería acá y marca las fotos
    // con `data-gal`; el listener de fotos vive en `document` y las agarra igual.
    galleries,
    catOf, catOfAct, CAT_META, CAT_ORDER, legType, MODE_STYLE, maskDates, maskLodging, maskFree, DX,
    // El plan fijo de un día y sus sugerencias linkean a Maps igual que el popup del
    // pin: misma función, mismo recorte del nombre (task 660).
    gmapsFromName,
    // Las actividades son de la CIUDAD, no de la visita (task 552): si una ciudad
    // tuviera varias paradas, el catálogo de sus días sería el mismo en todas.
    cityActivities, cityLabel,
    activityId, activityGroupsHtml: activityCatalogHtml,
    // Los links del lugar (Maps, el reel del que salió) son los mismos en la ficha de
    // actividad y en su renglón del itinerario (task 686): una función para los dos.
    sourceLinksHtml,
    nodeById: Object.fromEntries(destinations.map(d => [d.id, d])),
    focusTrip, openStopModal, flash,
    // Tramos (task 510): la línea del mapa y la ficha de la vista Transportes son la
    // misma cosa. La vista manda el estado por la URL (`?tramo=`) y el mapa marca; el
    // click en la línea entra por `onLegClick` y vuelve por el mismo camino.
    selectLeg, onLegClick: (fn) => { legClickHandler = fn; },
    // Hospedajes (task 544): el pin de cama y la ficha de la vista Hospedajes, igual.
    selectLodging, onLodgingClick: (fn) => { lodgingClickHandler = fn; },
    // Un ítem de una vista lateral vuela al punto en el mapa SIN cambiar de tab:
    // el mapa está a la vista, así que sacarte de donde estabas no tendría sentido.
    focusAct: (key) => focusMarker(actMarkers[key]),
    // Foco de día (task 508): la vista arma el recorrido (qué puntos y en qué orden)
    // y el mapa lo dibuja; salir vuelve por la URL, por eso el chip avisa para acá.
    focusDay: enterDayFocus, exitDayFocus, renderDayMap,
    focusDayAct: (key) => {
      const marker = _dayViewMarkers[key];
      if (!marker || !_dayViewMap) return;
      // "Ver en el mapa" con la categoría apagada: se la prende (chips incluidos),
      // igual que revealPin en la portada — volar a un pin que no está no muestra nada.
      const sug = _dayViewSuggestions.find(s => s.m === marker);
      if (sug) revealCat(sug.cat);
      _dayViewMap.setView(marker.getLatLng(), Math.max(_dayViewMap.getZoom(), 14));
      marker.openPopup();
      document.querySelector('[data-day-map]')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
    },
    plan: createPlanClient(),
    onDayExit: (fn) => { dayExitHandler = fn; },
    // Colgar el círculo de checklist sobre un pedazo de DOM ya montado: lo usa la vista
    // cuando promueve un renglón al itinerario (ahí nace su `data-check`) y cuando el
    // plan llega tarde y hay que repintar sin volver a colgar los listeners del pane.
    wireChecks: (root) => wireChecklist(root),
    // El estado del checklist entra como FUNCIÓN (no el Set): cada render pregunta por
    // el valor vigente. Una tachada sale de las sugerencias (task 700); el aviso de
    // vuelta (onChecklistChange) es lo que repinta las secciones sin recargar.
    isActivityDone: (key) => checkedActivities.has(key),
    onChecklistChange: (fn) => { checklistViewsHandler = fn; },
    wire: (pane) => {
      wireChecklist(pane);
      // Un catálogo recién llenado (fillCatalog es lazy) también reparte sus hechas
      // bajo "✓ n hechas": si no, llegan tachadas pero mezcladas con las vivas.
      arrangeChecklistCatalogs();
      pane.addEventListener('click', (e) => {
        const act = e.target.closest('[data-act]');
        if (act) { focusMarker(actMarkers[act.dataset.act]); return; }
        const jump = e.target.closest('[data-goto]');
        if (!jump) return;
        const d = destinations.find(x => x.id === jump.dataset.goto);
        if (!d) return;
        if (markers[d.id]) markers[d.id].openPopup();
        map.flyTo(d.coords, 8, { duration: 0.8 });
        focusTrip(d.id);   // deja la tarjeta abierta para cuando vuelvas al resumen
      });
    }
  });
} catch (err) {
  console.error('vistas laterales:', err);
  document.getElementById('tab-rail').hidden = true;
}
</script>
</body>
</html>
