// ------------------------------------------------------- foco de día (task 508)
// Tocar un día en la vista Días toma el mapa: se apagan todas las familias y quedan
// sólo los puntos de esa jornada, unidos por la línea del recorrido en el MISMO orden
// en que la lista los enumera (la vista arma ese orden y lo manda acá — ver dayRoute()
// en views.js). No es ruteo por calles: es la guía visual de "qué sigue a qué".
// Salir devuelve el mapa como estaba: capas, categorías y encuadre.
const focusLayer = L.layerGroup();
let dayFocus = null;          // { date, prev: {center, zoom}, shown: [markers] }
let dayExitHandler = null;    // lo registra views.js para que salir también toque la URL

const dayChip = document.createElement('div');
dayChip.className = 'day-chip';
const dayChipBtn = document.createElement('button');
dayChipBtn.type = 'button';
dayChipBtn.addEventListener('click', () => { dayExitHandler ? dayExitHandler() : exitDayFocus(); });
dayChip.appendChild(dayChipBtn);
map.getContainer().appendChild(dayChip);
L.DomEvent.disableClickPropagation(dayChip);

// El número del recorrido, pintado con el color de la categoría del punto: es el
// mismo círculo que la lista de la jornada pone delante del ítem.
const ordIcon = (n, color) => L.divIcon({
  html: '<div class="rt-ord" style="background:' + color + '">' + n + '</div>',
  className: '', iconSize: [16, 16], iconAnchor: [-5, 15],
});

// Un punto que el foco muestra directo sobre el mapa (su layerGroup está apagado).
// Se anota en `shown` para poder sacarlo al salir sin tocar el grupo del que salió.
function showFocused(m) {
  if (!m || !dayFocus || dayFocus.shown.includes(m)) return false;
  map.addLayer(m);
  dayFocus.shown.push(m);
  return true;
}

// La punta de un traslado: el aeropuerto / la estación / el puerto por donde se entra o
// se sale de la ciudad ese día. Vive sólo mientras dura el foco (es una punta de ESE
// día): el pin de aeropuerto de la capa de vuelos no cubre estaciones ni puertos, y con
// el foco tomado esa capa está apagada igual.
const termIcon = t => t.icon || (MODE_STYLE[t.mode] || MODE_STYLE.train).icon;
function terminalMarker(t) {
  const icon = L.divIcon({
    html: '<div class="term-marker">' + termIcon(t) + '</div>',
    className: '', iconSize: [24, 24], iconAnchor: [12, 12],
  });
  return L.marker(t.coords, { icon, zIndexOffset: 1100 })
    .bindPopup('<div class="popup-title">' + termIcon(t) + ' ' + t.name + '</div>');
}

// spec = { date, label, route: [{ key, cat }, ...] EN ORDEN DE RECORRIDO,
//          line: [ítems del trazo, en orden], stops: [ids], legs: [ids de tramo] }
// El orden lo decide la vista (dayRoute() en views.js, que ordena por geografía); acá
// sólo se dibuja. `line` es el trazo entero y cada ítem es una de tres cosas: `{ bed }`
// (un hospedaje — la cama de anoche o la de esta noche; cuando son la misma, la línea
// cierra el círculo), `{ terminal }` (la punta de un traslado del día) o una parada del
// recorrido, de la que se leen `key` y `cat` y nada más. El mapa no sabe de itinerario.
function enterDayFocus(spec) {
  if (!spec) return;
  // Cambiar de día no re-guarda el encuadre: el "volver" es al mapa previo al foco.
  const prev = dayFocus ? dayFocus.prev : { center: map.getCenter(), zoom: map.getZoom() };
  clearDayFocusLayers();
  dayFocus = { date: spec.date, prev, shown: [] };
  TOGGLES.forEach(t => t.layers.forEach(l => map.removeLayer(l)));
  // El foco apaga el transporte del viaje entero, pero el salto de ESE día es parte de
  // la jornada: su línea se queda —y con ella el click a su ficha—. Mismo criterio que
  // los pines del día, que también entran sin importar los filtros de afuera.
  (spec.legs || []).forEach(id => (legSegments[id] || []).forEach(s => { showFocused(s.pl); showFocused(s.hit); }));

  const line = [], ord = [];
  const step = m => { if (m) { showFocused(m); line.push(m.getLatLng()); return m.getLatLng(); } };
  (spec.line || []).forEach(p => {
    if (p.bed) { step(lodgingMarkers[p.bed]); return; }
    if (p.terminal) { terminalMarker(p.terminal).addTo(focusLayer); line.push(L.latLng(p.terminal.coords)); return; }
    const ll = step(actMarkers[p.key]);
    if (ll) ord.push({ ll, color: catColor(p.cat) });
  });
  // La parada del día entra SÓLO si el día no tiene paradas propias (traslado, llegada
  // sin nada cargado): si no, su número compite con el del recorrido y el centroide de
  // la ciudad no dice nada que los puntos no digan ya. Con las camas no alcanza —dos
  // pines de hotel no cuentan qué pasó ese día—, por eso mira `ord` y no `line`.
  const ctxPts = [];
  if (!ord.length) (spec.stops || []).forEach(id => {
    const m = markers[id];
    if (m && showFocused(m)) ctxPts.push(m.getLatLng());
  });

  if (line.length > 1) {
    // No se toca (`interactive: false`): es la guía del día, no un objeto con ficha. Y
    // desde que las puntas son las terminales del salto, el tramo del día queda
    // exactamente DEBAJO de este trazo — si tomara clicks, taparía el de su línea, que
    // es lo que abre la ficha del transporte.
    L.polyline(line, { color: '#0F6E56', weight: 3, opacity: 0.7, dashArray: '7, 6', lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(focusLayer);
  }
  // Numeradas van las paradas, no las camas: el recorrido es lo que se visita. Va
  // incluso con una sola, para que el "1" de la lista tenga su punto en el mapa.
  ord.forEach((p, i) => L.marker(p.ll, { icon: ordIcon(i + 1, p.color), interactive: false, zIndexOffset: 1200 }).addTo(focusLayer));
  focusLayer.addTo(map);

  dayChipBtn.innerHTML = '✕ ' + spec.label;   // `label` trae el DX de la fecha
  map.getContainer().classList.add('day-focus');
  // En mobile el mapa está arriba del sidebar y puede haber quedado fuera de la
  // pantalla: enfocar un día sin que se vea el mapa no muestra nada.
  if (map.getContainer().getBoundingClientRect().bottom < 80) {
    map.getContainer().scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  // Encuadre: manda el recorrido, camas incluidas —son sus puntas—. La ciudad entra
  // sólo cuando no hay paradas, porque si no un centroide lejano desarma el zoom.
  const fit = line.concat(ctxPts);
  if (fit.length === 1) map.flyTo(fit[0], 14, { duration: 0.7 });
  else if (fit.length) map.flyToBounds(L.latLngBounds(fit), { padding: [70, 70], maxZoom: 15, duration: 0.7 });
}

function clearDayFocusLayers() {
  if (dayFocus) dayFocus.shown.forEach(m => map.removeLayer(m));
  focusLayer.clearLayers();
  map.removeLayer(focusLayer);
}

function exitDayFocus() {
  if (!dayFocus) return;
  const prev = dayFocus.prev;
  clearDayFocusLayers();
  dayFocus = null;
  // Volver a la intención del usuario, no a "todo prendido": las familias apagadas
  // antes del foco siguen apagadas, y las categorías filtradas siguen filtradas
  // (sus pines nunca volvieron a su layerGroup).
  TOGGLES.forEach(t => { if (layerOn(t.key)) t.layers.forEach(l => map.addLayer(l)); });
  map.getContainer().classList.remove('day-focus');
  map.flyTo(prev.center, prev.zoom, { duration: 0.6 });
}

function applyCatFilter(skipUrl) {
  placePins.forEach(p => {
    const on = activeCats.has(p.cat);
    if (on && !p.layer.hasLayer(p.m)) p.layer.addLayer(p.m);
    else if (!on && p.layer.hasLayer(p.m)) p.layer.removeLayer(p.m);
  });
  CAT_ORDER.forEach(c => catBtns[c].classList.toggle('off', !activeCats.has(c)));
  allCatsBtn.hidden = activeCats.size === CAT_ORDER.length;
  if (skipUrl) return;
  const u = new URL(location.href);
  if (activeCats.size === CAT_ORDER.length) u.searchParams.delete('cat');
  else u.searchParams.set('cat', CAT_ORDER.filter(c => activeCats.has(c)).join(','));
  history.replaceState(null, '', u);
}

    // en vez de un mapa vacío, y limpiar el parámetro muerto de la URL.
    else stale = true;

})();

// Número de reserva: tap para copiarlo. Es el dato que se dice en el mostrador y
// tipearlo de un teléfono es justo lo que no se quiere hacer parado en un lobby.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.resv-ref');
  if (!btn) return;
  e.stopPropagation();
  const txt = btn.dataset.copy || btn.textContent;
  const ok = () => { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 1400); };
  // Sin Clipboard API (Safari viejo, contexto no seguro): seleccionar + execCommand. Si
  // tampoco copia, el número queda seleccionado y se copia con el menú del sistema — pero
  // no se dice "copiado", que sería mentira.
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(btn);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { if (document.execCommand('copy')) ok(); } catch (err) {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback);
  else fallback();
});

(function () {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = '<span class="lb-btn lb-close">×</span><span class="lb-btn lb-prev">‹</span>' +
    '<img class="lb-img" alt=""><span class="lb-btn lb-next">›</span>';
  document.body.appendChild(lb);
  const img = lb.querySelector('.lb-img');
  let cur = [], idx = 0;
  const show = () => { img.src = cur[idx]; };
  const close = () => { lb.classList.remove('open'); img.src = ''; };
  const step = (n) => { if (cur.length) { idx = (idx + n + cur.length) % cur.length; show(); } };
  detailsList.addEventListener('click', (e) => {
    const t = e.target.closest('[data-gal]');
    if (!t) return;
    e.stopPropagation();
    cur = galleries[t.dataset.gal] || []; idx = +t.dataset.gi;
    show(); lb.classList.add('open');
  });
  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('.lb-prev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  lb.querySelector('.lb-next').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;

  });
})();

// Toggle del modo discreto: botón 🙈 del header o tecla `d`; persiste en localStorage.
// Mueve los pines de cama al centro de su parada y re-renderiza la ficha si está abierta
// (los pares .dx/.dm del resto de la UI se alternan solos por CSS).
(function () {
  const btn = document.getElementById('discrete-toggle');
  function applyDiscrete(on) {
    document.body.classList.toggle('discrete', on);
    lodgingPins.forEach(p => p.mk.setLatLng(on ? p.masked : p.real));
    map.closePopup();
    try { localStorage.setItem(DISCRETE_KEY, on ? '1' : '0'); } catch (e) {}
    const s = new URLSearchParams(location.search);
    if (s.get('stop')) openStopModal(s.get('stop'));
    else if (s.get('leg')) openLegModal(s.get('leg'));
  }
  btn.addEventListener('click', () => applyDiscrete(!isDiscrete()));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'd' && e.key !== 'D') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    applyDiscrete(!isDiscrete());
  });
  let saved = null;
  try { saved = localStorage.getItem(DISCRETE_KEY); } catch (e) {}
  if (saved === '1') applyDiscrete(true);
})();

// ── Mi ubicación ────────────────────────────────────────────────────────────
// Punto azul + círculo de precisión sobre el mapa del viaje, para caminar por
// Tokio o otra parada y ver qué pin del viaje tenés al lado. El permiso se pide SOLO
// al tocar el botón (nunca al cargar) y la posición vive en memoria: no se
// guarda en localStorage ni sale de la página.
//
// Botón (esquina inferior derecha): tap 1 = prender · tap 2 = seguir (el mapa se
// centra en cada update) · tap 3 = apagar. Arrastrar el mapa sale del modo seguir.
// Con fix activo, cada popup de punto suma "a X m/km" y el punto azul abre la
// lista de los 5 lugares visibles más cercanos.
(function () {
  const meLayer = L.layerGroup().addTo(map);
  let meMarker = null, meCircle = null, mePos = null, meWatch = null, meState = 'off';
  let stampTarget = null, nearShown = [];

  const meBtn = document.createElement('button');
  meBtn.type = 'button';
  meBtn.className = 'me-btn';
  meBtn.title = 'Mi ubicación';
  meBtn.setAttribute('aria-label', 'Mi ubicación');
  meBtn.setAttribute('aria-pressed', 'false');
  meBtn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="7"/><path d="M12 1.5v3M12 19.5v3M22.5 12h-3M4.5 12h-3"/>' +
      '<circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>' +
    '</svg>';
  map.getContainer().appendChild(meBtn);
  L.DomEvent.disableClickPropagation(meBtn);

  const toastEl = document.createElement('div');
  toastEl.className = 'map-toast';
  toastEl.setAttribute('role', 'status');
  map.getContainer().appendChild(toastEl);
  let toastT = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  function fmtDist(km) {
    if (km < 1) return Math.round(km * 1000) + ' m';
    return (km < 10 ? km.toFixed(1) : Math.round(km)) + ' km';
  }

  // "Cerca tuyo" mira sólo lo que está EN el mapa: respeta los toggles de capa y
  // el filtro por categoría, así la lista siempre coincide con los pines visibles.
  function nearest(n) {
    if (!mePos) return [];
    return nearPts
      .filter(p => map.hasLayer(p.m))
      .map(p => {
        const ll = p.m.getLatLng();
        return { p: p, km: kmBetween(mePos.lat, mePos.lng, ll.lat, ll.lng) };
      })
      .sort((a, b) => a.km - b.km)
      .slice(0, n);
  }
  function nearLabel(p) { return (isDiscrete() && p.masked) ? p.masked : p.label; }
  function nearHtml() {
    nearShown = nearest(5);
    if (!nearShown.length) return '<div class="near"><div class="near-empty">Sin puntos del viaje cerca</div></div>';
    return '<div class="near">' + nearShown.map((e, i) =>
      '<button type="button" class="near-row" data-i="' + i + '">' +
        '<span class="near-dot" style="background:' + e.p.color + '"></span>' +
        '<span class="near-name">' + escHtml(nearLabel(e.p)) + '</span>' +
        '<span class="near-km">' + fmtDist(e.km) + '</span>' +
      '</button>').join('') + '</div>';
  }
  function wireNear(popup) {
    const el = popup && popup.getElement();
    if (!el) return;
    el.querySelectorAll('.near-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const it = nearShown[Number(btn.dataset.i)];
        if (!it) return;
        map.closePopup();
        map.flyTo(it.p.m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.7 });
        it.p.m.openPopup();
      });
    });
  }

  // Distancia en el popup de cada punto: se estampa al abrir y se refresca con
  // cada update de posición. El popup se re-renderiza de su HTML original al
  // reabrirse, así que no hay que limpiar nada.
  function stampDist(popup) {
    const el = popup && popup.getElement && popup.getElement();
    if (!el) return;
    const wrap = el.querySelector('.mini-pop') || el.querySelector('.leaflet-popup-content');
    if (!wrap) return;
    let tag = wrap.querySelector('.popup-dist');
    const ll = popup.getLatLng && popup.getLatLng();
    if (!mePos || !ll) { if (tag) tag.remove(); return; }
    if (!tag) {
      tag = document.createElement('div');
      tag.className = 'popup-dist';
      wrap.appendChild(tag);
    }
    tag.textContent = 'a ' + fmtDist(kmBetween(mePos.lat, mePos.lng, ll.lat, ll.lng));
  }
  nearPts.forEach(p => p.m.on('popupopen', e => { stampTarget = e.popup; stampDist(e.popup); }));
  map.on('popupclose', e => { if (e.popup === stampTarget) stampTarget = null; });

  function setState(s) {
    meState = s;
    meBtn.classList.toggle('wait', s === 'wait');
    meBtn.classList.toggle('on', s === 'on');
    meBtn.classList.toggle('follow', s === 'follow');
    meBtn.setAttribute('aria-pressed', String(s !== 'off'));
  }

  function meOff() {
    if (meWatch != null) navigator.geolocation.clearWatch(meWatch);
    meWatch = null;
    mePos = null;
    meLayer.clearLayers();
    meMarker = null;
    meCircle = null;
    nearShown = [];
    setState('off');
    if (stampTarget) stampDist(stampTarget);
  }

  function drawMe(ll, acc) {
    if (meMarker) {
      meMarker.setLatLng(ll);
      meCircle.setLatLng(ll).setRadius(acc);
      return;
    }
    meMarker = L.marker(ll, {
      icon: L.divIcon({ html: '<div class="me-dot"></div>', className: '', iconSize: [16, 16], iconAnchor: [8, 8] }),
      zIndexOffset: 1200, keyboard: false, title: 'Estás acá',
    }).addTo(meLayer);
    // El autoPanPadding saca la lista de abajo de la leyenda de modos (arriba) y
    // de las barras de chips (abajo): son controles, y siempre van sobre el popup.
    meMarker.bindPopup(nearHtml, {
      closeButton: false, offset: [0, -2], minWidth: 186, maxWidth: 250,
      autoPanPaddingTopLeft: [12, 82], autoPanPaddingBottomRight: [12, 72],
    });
    meMarker.on('popupopen', e => wireNear(e.popup));
    meCircle = L.circle(ll, {
      radius: acc, color: '#1F7AE0', weight: 1, opacity: 0.35,
      fillColor: '#1F7AE0', fillOpacity: 0.1, interactive: false,
    }).addTo(meLayer);
    meCircle.bringToBack();
  }

  function onFix(pos) {
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    const first = !mePos;
    mePos = ll;
    drawMe(ll, pos.coords.accuracy || 0);
    if (meState === 'wait') setState('on');
    // El mapa arranca mostrando el viaje entero: al primer fix acercamos a
    // escala de barrio, si no el punto azul se pierde entre los pines. Si ya
    // estabas mirando de cerca tu zona, no te movemos la vista.
    if (first) {
      if (map.getZoom() < 12 || !map.getBounds().contains(ll)) map.setView(ll, Math.max(map.getZoom(), 14));
    } else if (meState === 'follow') {
      map.panTo(ll);   // seguir = mantener el punto centrado, sin tocarte el zoom
    }
    if (stampTarget) stampDist(stampTarget);
    if (meMarker.isPopupOpen()) {
      meMarker.setPopupContent(nearHtml());
      wireNear(meMarker.getPopup());
    }
  }

  function onErr(err) {
    // Con un fix ya obtenido, un timeout suelto del watch no apaga nada.
    if (mePos && err.code !== 1) return;
    meOff();
    toast(err.code === 1
      ? 'Ubicación bloqueada — habilitala en el navegador'
      : 'No se pudo obtener tu ubicación');
  }

  meBtn.addEventListener('click', () => {
    if (meState === 'off') {
      if (!navigator.geolocation) { toast('Este navegador no comparte ubicación'); return; }
      setState('wait');
      meWatch = navigator.geolocation.watchPosition(onFix, onErr,
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
      return;
    }
    if (meState === 'wait') { meOff(); return; }            // cancelar mientras busca
    if (meState === 'on') {                                  // prendido → seguir
      setState('follow');
      if (mePos) map.setView(mePos, Math.max(map.getZoom(), 15));
      return;
    }
    meOff();                                                 // siguiendo → apagado
  });
  map.on('dragstart', () => { if (meState === 'follow') setState('on'); });
})();

// ---- Vistas laterales (task 499) -------------------------------------------
// Las tres vistas nuevas leen el mismo `destinations` y reusan los bloques que ya
// existen acá (reserva, categorías, escape de HTML). Si esto falla, el resumen
// —que es todo lo que había antes— tiene que seguir funcionando igual.
try {
  mountViews(destinations, {
    escHtml, resvHtml, resvUrl, RESV_PROVIDER, HOTEL_LINK_LABEL,
    catOf, catOfAct, CAT_META, CAT_ORDER, legType, MODE_STYLE, maskDates, maskLodging, maskFree, DX,
    focusTrip, openStopModal, flash,
    // Tramos (task 510): la línea del mapa y la ficha de la vista Transportes son la
    // misma cosa. La vista manda el estado por la URL (`?tramo=`) y el mapa marca; el
    // click en la línea entra por `onLegClick` y vuelve por el mismo camino.
    selectLeg, onLegClick: (fn) => { legClickHandler = fn; },
    // Hospedajes (task 544): el pin de cama y la ficha de la vista Hospedajes, igual.
    selectLodging, onLodgingClick: (fn) => { lodgingClickHandler = fn; },
    // Un ítem de una vista lateral vuela al punto en el mapa SIN cambiar de tab:
    // el mapa está a la vista, así que sacarte de donde estabas no tendría sentido.
    focusAct: (key) => focusMarker(actMarkers[key]),
    // Foco de día (task 508): la vista arma el recorrido (qué puntos y en qué orden)
    // y el mapa lo dibuja; salir vuelve por la URL, por eso el chip avisa para acá.
    focusDay: enterDayFocus, exitDayFocus,
    onDayExit: (fn) => { dayExitHandler = fn; },
    wire: (pane) => {
      wireChecklist(pane);
      pane.addEventListener('click', (e) => {
        const act = e.target.closest('[data-act]');
        if (act) { focusMarker(actMarkers[act.dataset.act]); return; }
        const jump = e.target.closest('[data-goto]');
        if (!jump) return;
        const d = destinations.find(x => x.id === jump.dataset.goto);
        if (!d) return;
        if (markers[d.id]) markers[d.id].openPopup();
        map.flyTo(d.coords, 8, { duration: 0.8 });
        focusTrip(d.id);   // deja la tarjeta abierta para cuando vuelvas al resumen
      });
    }
  });
} catch (err) {
  console.error('vistas laterales:', err);
  document.getElementById('tab-rail').hidden = true;
}
</script>
