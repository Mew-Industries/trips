// --- Modo discreto: enmascara fechas concretas, hospedajes y vuelos identificables
// para poder mostrar la app sin exponer datos rastreables. Toggle 🙈 en el header o
// tecla `d`; persiste en localStorage. DX(real, masked) emite el par .dx/.dm que el
// CSS alterna según body.discrete; con un solo argumento, en discreto no se muestra nada.
const DISCRETE_KEY = 'japon-discrete';
const isDiscrete = () => document.body.classList.contains('discrete');
const DX = (real, masked) => '<span class="dx">' + real + '</span>' + (masked ? '<span class="dm">' + masked + '</span>' : '');
// Posición genérica del pin de cama en discreto: cerca del centro de la parada,
// con un corrimiento fijo para no tapar el marcador numerado.
const maskedLodgingCoords = d => [d.coords[0] + 0.02, d.coords[1] + 0.025];
// Borra fechas/horas puntuales de un texto libre (intros) sin tocar duraciones (~1h45, 8 min).
const _MONTH_RE = '(?:ene|feb|mar|abr|may|jun|jul|ago|sept?|oct|nov|dic)';
function maskDates(t) {
  return String(t)
    .replace(/\d{4}-\d{2}-\d{2}/g, '···')
    .replace(new RegExp('\\b\\d{1,2}\\s*[-–]\\s*\\d{1,2}\\s+(?:de\\s+)?' + _MONTH_RE + '\\b', 'gi'), '···')
    .replace(new RegExp('\\b\\d{1,2}\\s+(?:de\\s+)?' + _MONTH_RE + '\\b', 'gi'), '···')
    .replace(/\b\d{1,2}\s*\/\s*\d{1,2}\b/g, '···')
    .replace(/\b\d{1,2}:\d{2}\b/g, '···')
    .replace(/\b[A-Z]{2}\d{1,4}\b/g, '···')
    .replace(/\b(?:el|del)\s+···/g, '···')
    .replace(/\b(?:el|del)\s+\d{1,2}\b(?!\s*(?:h\b|%|°))/g, '···')
    .replace(/···(?:[\s·,;]*···)+/g, '···');
}

// Modo de transporte de un tramo → estilo de línea + etiqueta. El modo primario
// se deduce de los emojis del leg (prioridad vuelo > ferry > tren > bus).
const MODE_STYLE = {
  air:   { color: '#2563EB', dash: '1, 7',         label: 'Vuelo', icon: '✈️', weight: 2 },  // azul, punteado fino
  train: { color: '#0F8A5F', dash: null,           label: 'Tren',  icon: '🚆', weight: 4 },  // verde, sólido grueso
  bus:   { color: '#E08A1E', dash: '11, 8',        label: 'Bus',   icon: '🚌', weight: 3 },  // naranja, guion largo
  ferry: { color: '#15A6C9', dash: '2, 6, 10, 6',  label: 'Ferry', icon: '⛴️', weight: 3 },  // cyan, guion-punto
};
function legType(leg) {
  const m = (leg && leg.mode) || '';
  if (m.indexOf('✈️') !== -1) return 'air';
  if (m.indexOf('⛴️') !== -1) return 'ferry';
  if (m.indexOf('🚄') !== -1 || m.indexOf('🚆') !== -1) return 'train';
  if (m.indexOf('🚌') !== -1) return 'bus';
  return 'train';
}
// Sub-detalle de un tramo (segmentos: vuelos/tramos con nº, horarios, avión, tracker).
function legSegsHtml(leg) {
  if (!leg || !leg.segments || !leg.segments.length) return '';
  return '<div class="leg-segs">' + leg.segments.map(s => {
    if (s.layover) return '<div class="leg-layover"><span>' + s.layover + '</span></div>';
    return '<a class="leg-seg"' + (s.tracker ? ' href="' + s.tracker + '" target="_blank" rel="noopener"' : '') + '>' +
      '<span class="seg-route">' + s.route + (s.no ? DX(' <span class="seg-no">' + s.no + '</span>') : '') + '</span>' +
      '<span class="seg-time">' + (s.when ? DX(s.when + (s.aircraft ? '<br>' : '')) : '') + (s.aircraft || '') + '</span>' +
    '</a>';
  }).join('') + '</div>';
}

// Líneas de ruta POR TRAMO, siguiendo el transporte real (waypoints en leg.via),
// con color/trazo según el modo. Cada segmento es clickeable (→ resalta el tramo
// en el panel) y queda referenciado por id del nodo destino para el link inverso.
const legSegments = {};
const routeLayer = L.layerGroup().addTo(map);   // transporte terrestre (tren/bus/ferry)
const flightLayer = L.layerGroup().addTo(map);  // vuelos
function styleFor(mode) {
  const st = MODE_STYLE[mode];
  return { color: st.color, weight: st.weight, opacity: mode === 'air' ? 0.65 : 0.82, dashArray: st.dash };
}
for (let i = 0; i < destinations.length - 1; i++) {
  const a = destinations[i], b = destinations[i + 1];
  // Sub-tramos por modo real: si el leg tiene `path` (multi-modal), cada paso se
  // dibuja con su modo (así los buses aparecen y los vuelos sólo en la parte aérea).
  // Si no, una sola línea del modo primario (con waypoints `via` si los hay).
  let subsegs;
  if (b.leg && b.leg.path) {
    let from = a.coords;
    subsegs = b.leg.path.map(step => { const seg = { pts: [from, step.to], mode: step.m }; from = step.to; return seg; });
  } else {
    const pts = [a.coords].concat((b.leg && b.leg.via) || []).concat([b.coords]);
    subsegs = [{ pts: pts, mode: legType(b.leg) }];
  }
  const pls = subsegs.map(seg => {
    const base = styleFor(seg.mode);
    const pl = L.polyline(seg.pts, base).addTo(seg.mode === 'air' ? flightLayer : routeLayer);
    pl.on('click', () => { focusTrip(b.id); highlightSegment(b.id); });  // mapa → panel
    return { pl: pl, base: base };
  });
  legSegments[b.id] = pls;
}

// Resaltar un tramo en el mapa (flash + encuadre). Usado por el click en la fila
// de transporte del panel y por focusTrip. Resalta TODOS los sub-tramos del leg.
function highlightSegment(id) {
  const arr = legSegments[id];
  if (!arr || !arr.length) return;
  const bounds = L.latLngBounds([]);
  arr.forEach(s => {
    s.pl.setStyle({ color: '#D85A30', weight: 6, opacity: 1, dashArray: null });
    s.pl.bringToFront();
    bounds.extend(s.pl.getBounds());
  });
  try { map.fitBounds(bounds, { padding: [50, 50], maxZoom: 8 }); } catch (e) {}
  setTimeout(() => arr.forEach(s => s.pl.setStyle(s.base)), 1800);
}

// Tarjeta de hospedaje (Airbnb/hotel/ryokan) para el detalle de un destino.
// En modo discreto: solo "Reservado" + ciudad + noches (sin nombre/dirección/links/fechas).
function lodgingHtml(L, city) {
  if (!L) return '';
  const sub = [L.type, L.guests].filter(Boolean).join(' · ');
  const dateStr = (L.checkIn && L.checkOut) ? (L.checkIn + ' → ' + L.checkOut + (L.nights ? ' · ' + L.nights + ' noches' : '')) : '';
  // Links explícitos: Airbnb (si url es de airbnb) y/o Google Maps (url de maps o mapsUrl de la dirección).
  const lnk = (href, label) => '<a class="lodging-link" href="' + href + '" target="_blank" rel="noopener">' + label + ' ↗</a>';
  const links = [];
  if (L.url) links.push(/airbnb/i.test(L.url) ? lnk(L.url, 'Ver en Airbnb') : lnk(L.url, 'Ver en Google Maps'));
  if (L.mapsUrl) links.push(lnk(L.mapsUrl, 'Google Maps'));
  const meta = [dateStr].concat(L.booked ? ['✓ Reservado'] : []).concat(links).filter(Boolean).join(' · ');
  const inner =
    (L.img ? '<img class="lodging-img" src="' + L.img + '" loading="lazy" alt="">' : '') +
    '<div class="lodging-body">' +
      '<div class="lodging-name">' + L.name + (L.rating ? ' · ' + L.rating : '') + '</div>' +
      (sub ? '<div class="lodging-sub">' + sub + '</div>' : '') +
      (L.area ? '<div class="lodging-area">' + L.area + '</div>' : '') +
      (L.note ? '<div class="lodging-area" style="font-style:italic">' + L.note + '</div>' : '') +
      '<div class="lodging-meta">' + meta + '</div>' +
    '</div>';
  const masked =
    '<div class="lodging-body">' +
      '<div class="lodging-name">Reservado</div>' +
      '<div class="lodging-sub">' + [city, L.nights ? L.nights + ' noches' : ''].filter(Boolean).join(' · ') + '</div>' +
    '</div>';
  return '<div class="card-section-title">🛏️ Hospedaje</div>' +
    '<div class="lodging-card dx">' + inner + '</div>' +
    '<div class="lodging-card dm">' + masked + '</div>';
}

// Reels ⇄ paradas: cada lugar de reel se asigna a la parada cuyo `short` prefija su
// `area`, o si no a la más cercana (<30 km). Sin match → tarjeta propia al final.
function kmBetween(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * rad / 2) ** 2 +
    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lon2 - lon1) * rad / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
const reelsByDest = {};
const reelOrphans = [];
(window.REEL_PLACES || []).forEach((p, ri) => {
  let dest = destinations.find(d =>
    p.area === d.short || (p.area || '').indexOf(d.short + ' ') === 0);
  if (!dest && p.lat != null) {
    let bestKm = 30;
    destinations.forEach(d => {
      const km = kmBetween(p.lat, p.lon, d.coords[0], d.coords[1]);
      if (km < bestKm) { bestKm = km; dest = d; }
    });
  }
  if (dest) (reelsByDest[dest.id] = reelsByDest[dest.id] || []).push(ri);
  else reelOrphans.push(ri);
});
function reelLinksHtml(p) {
  return (p.reels || []).map(r =>
    '<a class="reel-link" href="' + r.url + '" target="_blank" rel="noopener" title="' +
    (r.owner ? '@' + r.owner : 'reel') + '">🎬</a>'
  ).join('');
}

function highlightMarker(id) { const el = document.querySelector('.marker-num[data-id="' + id + '"], .marker-diamond[data-id="' + id + '"]'); if (el) el.classList.add('active'); }
function unhighlightMarker(id) { const el = document.querySelector('.marker-num[data-id="' + id + '"], .marker-diamond[data-id="' + id + '"]'); if (el) el.classList.remove('active'); }
function highlightDaytrip(id) { const el = document.querySelector('.marker-dot[data-id="' + id + '"]'); if (el) el.classList.add('active'); }
function unhighlightDaytrip(id) { const el = document.querySelector('.marker-dot[data-id="' + id + '"]'); if (el) el.classList.remove('active'); }

// Llevar del mapa al sidebar de forma clara: expandir la card, anclar al inicio del
// "viaje" (la fila de transporte que precede al destino) y resaltarlo con un flash.
// Ancla al top del bloque para que la carga de imágenes de abajo no descoloque el scroll.
function flash(el) {
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1500);
}
// --- Deep-linking: ?stop=<id> abre y enfoca una parada (para compartir una vista). ---
function shareUrl(kind, id) {
  return location.origin + location.pathname + '?' + kind + '=' + encodeURIComponent(id);
}
function setView(kind, id) {  // kind: 'stop' | 'leg' | null
  const u = new URL(location.href);
  u.searchParams.delete('stop'); u.searchParams.delete('leg');
  if (kind && id) u.searchParams.set(kind, id);
  history.replaceState(null, '', u);
}
function hasViewParam() {
  const s = new URLSearchParams(location.search);
  return s.get('stop') || s.get('leg');
}
// --- Ficha individual por parada (modal): info condensada + mini-mapa con sus pines/rutas. ---
let _smMap = null, _smLayer = null;

      '</div>' +
      '<div class="sm-content"></div>' +
    '</div>';

function closeStopModal() {

function smBodyHtml(d) {
  const cc = { '🇯🇵': 'jp', '🇰🇷': 'kr' };
  const gal = (d.imgs && d.imgs.length) ? d.imgs : (d.img ? [d.img] : []);
  const flag = (d.flag && cc[d.flag]) ? '<img class="sm-flag" src="https://flagcdn.com/' + cc[d.flag] + '.svg" alt="">' : '';
  const meta = d.type === 'fullday' ? (DX(d.dates + ' · ') + 'pasar el día') : (DX(d.dates + ' · ') + d.nights + ' noches');
  const hero = gal.length ? '<div class="sm-hero">' + gal.slice(0, 3).map(u => '<img src="' + u + '" loading="lazy" alt="">').join('') + '</div>' : '';
  const leg = d.leg ? '<div class="sm-sec"><div class="card-section-title">Cómo se llega</div><div class="sm-leg"><span class="sm-leg-mode">' + (d.leg.mode || '') + '</span> ' + (d.leg.time ? '<b>' + d.leg.time + '</b> · ' : '') + (d.leg.detail || '') + '</div>' + legSegsHtml(d.leg) + '</div>' : '';
  const acts = (d.activities && d.activities.length)
    ? '<div class="sm-sec"><div class="card-section-title">Qué hacer · ' + d.activities.length + '</div>' +
        CAT_ORDER.filter(c => d.activities.some(a => a.cat === c)).map(c =>
          '<div class="cat-group"><div class="cat-head">' + (CAT_LABELS[c] || c) + '</div><ul class="card-list">' +
            d.activities.filter(a => a.cat === c).map(a =>
              a.url ? '<li><a class="sm-act" href="' + a.url + '" target="_blank" rel="noopener">' + a.text + ' ↗</a></li>'
                    : '<li class="act-row-plain">' + a.text + '</li>'
            ).join('') +
          '</ul></div>'
        ).join('') +
      '</div>'
    : '';
  const dts = (d.daytrips && d.daytrips.length)
    ? '<div class="sm-sec"><div class="card-section-title">Day trips</div><ul class="card-list">' +
        d.daytrips.map(t => '<li>' + (t.url ? '<a class="sm-act" href="' + t.url + '" target="_blank" rel="noopener">' + t.name + ' ↗</a>' : t.name) + (t.desc ? '<div class="sm-dt-desc">' + t.desc + '</div>' : '') + '</li>').join('') +

    (d.intro ? '<p class="sm-intro">' + DX(d.intro, maskDates(d.intro)) + '</p>' : '') +

}
function buildStopMiniMap(d, idx) {
  const c = document.getElementById('sm-map');
  if (!c) return;
  if (_smMap) { _smMap.remove(); _smMap = null; }  // el contenedor se recrea en cada apertura
  _smMap = L.map(c, { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { subdomains: 'abcd', maxZoom: 19 }).addTo(_smMap);
  _smLayer = L.layerGroup().addTo(_smMap);
  const pts = [];
  if (idx > 0 && d.leg) {  // tramo de llegada, por modo real
    const a = destinations[idx - 1];
    let subsegs;
    if (d.leg.path) { let from = a.coords; subsegs = d.leg.path.map(s => { const seg = { pts: [from, s.to], mode: s.m }; from = s.to; return seg; }); }
    else { subsegs = [{ pts: [a.coords].concat(d.leg.via || []).concat([d.coords]), mode: legType(d.leg) }]; }
    subsegs.forEach(seg => { L.polyline(seg.pts, styleFor(seg.mode)).addTo(_smLayer); seg.pts.forEach(p => pts.push(p)); });
  }
  L.marker(d.coords, { icon: L.divIcon({ html: '<div class="marker-num">' + d.n + '</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(_smLayer);
  pts.push(d.coords);
  (d.activities || []).forEach(a => { if (a.coords) { L.circleMarker(a.coords, { radius: 5, color: '#D85A30', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(_smLayer).bindPopup(a.text); pts.push(a.coords); } });
  (d.daytrips || []).forEach(t => { if (t.coords) { L.circleMarker(t.coords, { radius: 5, color: '#2563EB', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(_smLayer).bindPopup(t.name); pts.push(t.coords); } });
  if (d.lodging && d.lodging.coords) { const lc = isDiscrete() ? maskedLodgingCoords(d) : d.lodging.coords; L.marker(lc, { icon: L.divIcon({ html: '<div class="lodging-marker">🛏️</div>', className: '', iconSize: [28, 28], iconAnchor: [14, 14] }) }).addTo(_smLayer).bindPopup(lodgingPopupHtml(d.lodging, d.short)); pts.push(lc); }
  setTimeout(() => { _smMap.invalidateSize(); try { _smMap.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 12 }); } catch (e) { _smMap.setView(d.coords, 10); } }, 60);
}
function _wireShare(el, kind, id) {
  const sb = el.querySelector('.sm-share');
  sb.classList.remove('copied'); sb.innerHTML = '🔗 Copiar link';
  sb.onclick = () => {
    const link = shareUrl(kind, id);
    const done = () => { sb.classList.add('copied'); sb.innerHTML = '✓ Link copiado'; setTimeout(() => { sb.classList.remove('copied'); sb.innerHTML = '🔗 Copiar link'; }, 1700); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(() => prompt('Copiá el link:', link));
    else prompt('Copiá el link:', link);
  };
}
function _showModal(el) { el.hidden = false; document.body.classList.add('sm-open'); el.querySelector('.sm-dialog').scrollTop = 0; }

function openStopModal(id) {

// Ficha de un TRAMO de transporte: modo, duración, segmentos + mini-mapa de la ruta real.

function buildLegMiniMap(d, idx) {
  const c = document.getElementById('sm-map'); if (!c) return;

  _smMap = L.map(c, { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { subdomains: 'abcd', maxZoom: 19 }).addTo(_smMap);
  _smLayer = L.layerGroup().addTo(_smMap);
  const prev = idx > 0 ? destinations[idx - 1] : null, pts = [];
  if (prev) {
    let subsegs;
    if (d.leg.path) { let from = prev.coords; subsegs = d.leg.path.map(s => { const seg = { pts: [from, s.to], mode: s.m }; from = s.to; return seg; }); }
    else { subsegs = [{ pts: [prev.coords].concat(d.leg.via || []).concat([d.coords]), mode: legType(d.leg) }]; }
    subsegs.forEach(seg => { L.polyline(seg.pts, styleFor(seg.mode)).addTo(_smLayer); seg.pts.forEach(p => pts.push(p)); });
    [prev, d].forEach(node => { L.marker(node.coords, { icon: L.divIcon({ html: '<div class="marker-num">' + node.n + '</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(_smLayer).bindPopup(node.short); pts.push(node.coords); });
  } else {
    L.marker(d.coords, { icon: L.divIcon({ html: '<div class="marker-num">' + d.n + '</div>', className: '', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(_smLayer).bindPopup(d.short); pts.push(d.coords);
  }
  setTimeout(() => { _smMap.invalidateSize(); try { _smMap.fitBounds(L.latLngBounds(pts), { padding: [35, 35], maxZoom: 11 }); } catch (e) { _smMap.setView(d.coords, 8); } }, 60);

function openLegModal(id) {

function focusTrip(id) {

  setTimeout(() => {

    flash(legRows[id]); flash(card);

// Labels de fecha en cada segmento de la ruta. La fecha = día en que se hace ese
// tramo (= fecha de inicio del nodo de destino). Click → abre la card del destino,
// donde la fila de transporte (leg) está justo arriba.
function segStartDate(s) {
  const day = s.match(/^\s*(\d{1,2})/);
  const mon = s.match(/(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)/i);
  return day && mon ? day[1] + ' ' + mon[1] : s;
}
for (let i = 0; i < destinations.length - 1; i++) {

  const segIcon = L.divIcon({
    html: '<div class="seg-date">' + segStartDate(b.dates) + '</div>',
    className: '', iconSize: [40, 16], iconAnchor: [20, 8],
  });

// Lightbox para las galerías de fotos (click en una miniatura → se expande).
(function () {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = '<span class="lb-btn lb-close">×</span><span class="lb-btn lb-prev">‹</span>' +
    '<img class="lb-img" alt=""><span class="lb-btn lb-next">›</span>';
  document.body.appendChild(lb);
  const img = lb.querySelector('.lb-img');
  let cur = [], idx = 0;
  const show = () => { img.src = cur[idx]; };
  const close = () => { lb.classList.remove('open'); img.src = ''; };
  const step = (n) => { if (cur.length) { idx = (idx + n + cur.length) % cur.length; show(); } };
  detailsList.addEventListener('click', (e) => {
    const t = e.target.closest('.gallery-thumb');
    if (!t) return;
    e.stopPropagation();
    cur = galleries[t.dataset.gal] || []; idx = +t.dataset.gi;
    show(); lb.classList.add('open');
  });
  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('.lb-prev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  lb.querySelector('.lb-next').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
})();

// Toggle del modo discreto: botón 🙈 del header o tecla `d`; persiste en localStorage.
// Mueve los pines de cama al centro de su parada y re-renderiza la ficha si está abierta
// (los pares .dx/.dm del resto de la UI se alternan solos por CSS).
(function () {
  const btn = document.getElementById('discrete-toggle');
  function applyDiscrete(on) {
    document.body.classList.toggle('discrete', on);
    lodgingPins.forEach(p => p.mk.setLatLng(on ? p.masked : p.real));
    map.closePopup();
    try { localStorage.setItem(DISCRETE_KEY, on ? '1' : '0'); } catch (e) {}
    const s = new URLSearchParams(location.search);
    if (s.get('stop')) openStopModal(s.get('stop'));
    else if (s.get('leg')) openLegModal(s.get('leg'));
  }
  btn.addEventListener('click', () => applyDiscrete(!isDiscrete()));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'd' && e.key !== 'D') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    applyDiscrete(!isDiscrete());
  });
  let saved = null;
  try { saved = localStorage.getItem(DISCRETE_KEY); } catch (e) {}
  if (saved === '1') applyDiscrete(true);
})();
</script>
</body>
</html>
